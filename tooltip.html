<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span {
            font-weight: bold;
            background-color: greenyellow;
            border-radius: 16px;
            padding: 5px;
            visibility: hidden;
        }
        div:hover span {
            visibility: visible;
        }
        div:hover {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div>Hover this text!!
        <span>This is a tooltip text</span>
    </div>
</body>
</html>
