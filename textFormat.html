<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            border: 1px solid black;
            color: red;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            text-indent: 500px;
            letter-spacing: 5px;
            word-spacing: 10px;
            text-shadow: 5px 5px 5px black;
        }
        .p1 {
            line-height: 50px;
            font-family: sans-serif;
        }
        .p2 {
            font-style: italic;
            /* font-weight: lighter; */
            font-variant: small-caps;
        }
        .p3{
            font-style: oblique;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div>This text is for formatting purpose!</div>
    <p class="p1">This is a p tag</p>
    <p class="p2">This is a p tag</p>
    <p class="p3">This is a p tag</p>
</body>
</html>
