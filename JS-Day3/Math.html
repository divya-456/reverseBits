<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //abs
        document.write("Absolute : "+Math.abs(-40));
        document.write("<br><br>");
        
        //ceil
        document.write("Ceil : " + Math.ceil(4.2)+"<br>")
        document.write("Ceil : " + Math.ceil(5.9))
        document.write("<br><br>");

        //floor
        document.write("Floor : " + Math.floor(4.2)+"<br>")
        document.write("Floor : " + Math.floor(5.9));
        document.write("<br><br>");
        
        //round
        document.write("Round : "+Math.round(10.46999999999)+"<br>");
        document.write("Round : "+Math.round(10.5));
        document.write("<br><br>");
        
        //max
        document.write("Max : "+Math.max(10,20,30,40,100,10,22,"101"));
        document.write("<br><br>");
        
        //min
        document.write("Min : "+Math.min(10,20,30,40,100,10,22,"101"));
        document.write("<br><br>");
        
        //pow
        document.write("Power : " + Math.pow(2,3)+"<br>");
        document.write("Power : " + Math.pow(0,0));
        document.write("<br><br>");
        
        //random
        document.write("Random : "+parseInt(Math.random()*100))
        document.write("<br><br>");
        
        //sqrt
        document.write("Sqrt : "+Math.sqrt(40));
        document.write("<br><br>");

        //trunc
        document.write("Trunc : "+Math.trunc(3.999999999999999))

    
    </script>
</head>
<body>
    
</body>
</html>
