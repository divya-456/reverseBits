<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function myFunc() {
        alert("the page has been loaded!");
      }
      function resize() {
        alert("You resized the window");
      }
      function redirect() {
        window.location = "https://www.google.com";
      }
    </script>
  </head>
  <body onload="myFunc()" onresize="resize()">
    <button onclick="redirect()">Google</button>
  </body>
</html>
