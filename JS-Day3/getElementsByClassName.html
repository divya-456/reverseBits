<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function change() {
            document.getElementsByClassName('demo')[0].style.color = "red";
        }
    </script>
</head>
<body>
    <p class="demo">Hello</p>
    <p class="demo">Hello</p>
    <p class="demo">Hello</p>
    <button onclick="change()">Change</button>
</body>
</html>
