<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // Arithmetic Concat
        a=10;
        b=20;
        document.write(a+b);

        // String Concat
        str1 = "What a very"
        str2 = "nice day"
        document.write("<br />"+str1+ " " + str2 + "<br />")
         
        // Strings and numbers concat
        name = "Divya"
        num = 456
        document.write(name + num + "<br />")

        num1 = "1";
        num2 = 2;
        document.write(num1+num2 + "<br />")
    </script>
</head>
<body>
    <p>Rule no 1 : If you add a number and a string the result would be a string</p>
    <p>Rule no 2 : Never forget Rule no 1</p>
</body>
</html>
