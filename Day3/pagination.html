<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        .pagination a {
            border: 1px solid #ddd;
            float: left;
            color: black;
            padding: 10px;
            text-decoration: none;
        }
        .pagination a.active {
            background-color: blueviolet;
            color: white;
            border-radius: 7px;
        }
        .pagination a:hover:not(.active){
            background-color: grey;
            border-radius: 7px;
        }
    </style>
  </head>
  <body>
    <div class="pagination">
      <a href="#">&laquo;</a>
      <a href="#">1</a>
      <a href="#" class="active">2</a>
      <a href="#">3</a>
      <a href="#">4</a>
      <a href="#">5</a>
      <a href="#">&raquo;</a>
    </div>
  </body>
</html>
