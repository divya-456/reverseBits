<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        label {
            color: brown;
            font-weight: bold;
            text-shadow: 5px 5px 5px yellow;
        }
        input {
            width: 50%;
            background-color: rgba(180,238,238,0.859);
            padding: 12px 30px;
            margin: 8px 0;
            box-sizing: border-box; /* Includes the padding and border in its width and height---------- */
        }
    </style>
</head>
<body>
    <form method="post">
        <label for="fname">
            First Name:
            <input type="text" name="fname" id="fname">
        </label><br>
        <label for="lname">
            Last Name:
            <input type="text" name="lname" id="lname">
        </label>
    </form>
</body>
</html>
