<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img {
            height: 100px;
            width : 100px;
            z-index: 7;
            position: absolute;
        }
        .div1 {
            color: red;
            position: absolute;
            top: 0;
            border: 1px solid black;
            background-color: yellow;
            z-index: 0;
        }
        .div2 {
            color: red;
            position: absolute;
            top: 10px;
            border: 1px solid black;
            background-color: red;
            z-index: 1;
        }
    </style>
</head>
<body>
    <img src="peacockFeatherImage.jpg" >
    <div class="div1">This is a div.....................................</div>
    <div class="div2">This is another div..........</div>
</body>
</html>
