<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        label {
            color: brown;
            font-weight: bold;
            text-shadow: 5px 5px 5px yellow;
        }
        input {
            width: 96%;
            background-color: azure;
            padding: 12px 30px;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <p>Form</p>
    <form method="post">
        <label for="fname">
            First Name:
            <input type="text" name="fname" id="fname">
        </label>
        <label for="lname">
            Last Name:
            <input type="text" name="lname" id="lname">
        </label>
    </form>
</body>
</html>
