<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/login.css" />
    <script src="../JS/Login.js"></script>

    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
  </head>
  <body>
    <div class="container" id="outer-div">
      <div class="forms">
        <div class="form login">
          <span class="title">Login</span>
          <form action="#">
            <div class="input-field">
              <input type="text" placeholder="Enter your email" required />
              <i class="uil uil-envelope icon"></i>
            </div>
            <div class="input-field">
              <input
                type="password"
                class="login-password"
                placeholder="Enter your password"
                required
              />
              <i class="uil uil-lock icon"></i>
              <i class="uil uil-eye-slash showHidePw"></i>
            </div>
            <div class="checkbox-text">
              <div class="checkbox-content">
                <label for="logCheck" class="text">
                  <input type="checkbox" id="logCheck" />
                  Remember me
                </label>
              </div>
              <a href="#" class="text">Forgot password?</a>
            </div>
            <div class="input-field button">
              <input type="button" value="Login" />
            </div>
          </form>
          <div class="login-signup">
            <span class="text">
              Not a member?
              <span onclick="changeForm()">
                  <a href="#" class="text signup-link">Signup Now</a>
              </span>
            </span>
          </div>
        </div>
        <div class="form signup">
          <span class="title">Registration</span>
          <form action="#">
            <div class="input-field">
              <input type="text" placeholder="Enter your name" id="name" onchange="validateName()" required/>
              <i class="uil uil-user left-icon-signup"></i>
              <i class="uil uil-exclamation-circle showError"></i>
            </div>
            <p class="error-text"></p>
            <div class="input-field">
              <input type="text" placeholder="Enter your email" id="signup-email" onchange="validateEmail()" required />
              <i class="uil uil-envelope icon left-icon-signup"></i>
              <i class="uil uil-exclamation-circle showError"></i>
            </div>
            <p class="error-text"></p>
            <div class="input-field">
              <input
                type="password"
                class="signup-password"
                placeholder="Create a password"
                required
                onchange="validatePassword()"
              />
              <i class="uil uil-lock left-icon-signup"></i>
              <i class="uil uil-exclamation-circle showError"></i>
            </div>
            <p class="error-text"></p>
            <div class="input-field">
              <input
                type="password"
                class="signup-password"
                placeholder="Confirm a password"
                onchange="validateConfirmPassword()"
                required
              />
              <i class="uil uil-lock icon left-icon-signup"></i>
              <i class="uil uil-eye-slash showHidePw"></i>
            </div>
            <p class="error-text"></p>
            <div class="checkbox-text">
              <div class="checkbox-content">
                <label for="termCon" class="text">
                  <input type="checkbox" id="termCon" />I accepted all terms and
                  conditions
                </label>
              </div>
            </div>
            <p class="checkbox"></p>
            <div class="input-field button">
              <input type="button" value="Signup" />
            </div>
          </form>
          <div class="login-signup">
            <span class="text">
              Already a member?
              <span onclick="changeForm()">
                  <a href="#" class="text login-link">Login Now</a>
              </span>
            </span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
