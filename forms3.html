<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        label {
            color: brown;
            font-weight: bold;
            text-shadow: 5px 5px 5px yellow;
        }
        input[type="text"] {
            background-color: azure;
            padding: 12px 30px;
            width: 100%;
            box-sizing: border-box;
            margin: 8px 0;
        }
        input[type="email"]{
            background-color: pink;
            padding: 12px 30px;
            width: 100%;
            box-sizing: border-box;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <form method="post">
        <label for="fname">
            First Name:
            <input type="text" name="fname" id="fname">
        </label>
        <label for="email">
            Email:
            <input type="email" name="email" id="email">
        </label>
    </form>
</body>
</html>
