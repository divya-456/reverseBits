<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      // length
      var arr1 = new Array(10, "20", "30", 40);
      document.write("Length of array is : " + arr1.length + "<br><br>");

      // concat
      var arr2 = new Array("11", "22", "33");
      document.write("Concatenation : " + arr1.concat(arr2) + "<br><br>");

      // flat
      var arr3 = [1, 2, 3, [4, 5], [6, 7, [8, 9]]];
      var newArr = arr3.flat();
      document.write("Flat array : " + newArr + "<br><br>");

      // fill
      var arr4 = ["10", "20", "30", 40, true, false, null, undefined, 10];
      document.write("Fill : " + arr4.fill("JS", 0, 2) + "<br><br>");

      //   document.write(arr1[0] + arr1[2]);

      // includes
      var arr5 = [10, 20, "30", "40"];
      document.write("Includes 10 : " + arr5.includes(10) + "<br>");
      document.write("Includes 40 : " + arr5.includes(40) + "<br>");
      document.write("Includes 20 : " + arr5.includes(20) + "<br><br>");

      //index of
      var arr6 = [10, 20, "20", 30, "10", 10];
      document.write('Index of "30"(str) :' + arr6.indexOf("30") + "<br>");
      document.write("Index of 20(int) : " + arr6.indexOf(20) + "<br>");
      document.write('Index of "10"(str) :' + arr6.indexOf("10") + "<br>");
      document.write("Index of 30(int) : " + arr6.indexOf(30) + "<br><br>");

      //isArray
      var arr = [];
      var arr7 = {};
      document.write('Is "arr" an array : ' + Array.isArray(arr) + "<br>");
      document.write(
        'Is "arr7" an array : ' + Array.isArray(arr7) + "<br><br>"
      );

      //join
      var arr8 = [10, 20, 30, "40"];
      document.write("Join : " + arr8.join() + "<br><br>");

      //lastIndexOf
      var arr9 = [10, 20, 30, 10, 40, 50, 10, 60];
      document.write(
        "Last index of arr9 : " + arr9.lastIndexOf(10) + "<br><br>"
      );

      //map
      var arr10 = [2.4, 7.9, 4.1];
      document.write("Map method : " + arr10.map(Math.round) + "<br><br>");

      //pop
      document.write("Pop method : " + arr10.pop() + "<br>");
      document.write("After pop : " + arr10 + "<br><br>");

      //push
      var arr11 = ["C ", "C++ "];
      document.write("Push method : " + arr11.push("HTML ") + "<br>");
      document.write("After push : " + arr11 + "<br>");
      document.write("Push 2 elements : " + arr11.push("CSS ", "JS") + "<br>");
      document.write("After push : " + arr11 + "<br><br>");

      //reverse
      var arr12 = [10, 20, 30];
      document.write("Reverse Method : " + arr12.reverse() + "<br><br>");

      //shift -removes and returns the first element of an array
      document.write("Shift Method : " + arr12.shift() + "<br>");
      document.write("After Shift : " + arr12 + "<br><br>");

      //unshift - it adds one or more elements at the start of an array
      var arr13 = ["C ", "C++ "];
      document.write("Unshift Method : " + arr13.unshift("Html") + "<br>");
      document.write("After unshift : " + arr13 + "<br>");
      document.write("Unshift Method : " + arr13.unshift("CSS", "JS") + "<br>");
      document.write("After unshift : " + arr13 + "<br><br>");

      //slice - return a copy of array from the index provided
      var arrr = [1, 2, 3, 4, 5];
      document.write("Sliced array : " + arrr.slice(1, 3) + "<br><br>");

      //sort
      var arr14 = [1, 4, 3, 9, 4, 2, 0];
      document.write("Sorted array : " + arr14.sort() + "<br><br>");

      //splice - array.splice(start,delete,elem) - start is from where to start the deletion, delete is no. of elemets to be deleted from there and elem is the element to be added

      var arr15 = [10, 20, 30, 40, 50];
      document.write("Spliced array : " + arr15.splice(1, 2, 25) + "<br>");
      document.write("New array : " + arr15 + "<br><br>");

      //entries, keys, values
      var arr16 = [1, 2, 3, 4, 5, 6, 7, 8, 9];

      var itr1 = arr16.entries();
      document.write("itr1 : " + itr1 + "<br>");
      document.write("Entries :<br>");
      for (const i of itr1) {
        document.write(i + "<br>");
      }

      var itr2 = arr16.keys();
      document.write("itr2 : " + itr2 + "<br>");
      document.write("Keys :<br>");
      for (const i of itr2) {
        document.write(i + "<br>");
      }

      var itr3 = arr16.values();
      document.write("itr3 : " + itr3 + "<br>");
      document.write("Values :<br>");
      for (const i of itr3) {
        document.write(i + "<br>");
      }

      var array = new Array();
      array[4] = 10;
      document.write(array);
    </script>
  </head>
  <body></body>
</html>
