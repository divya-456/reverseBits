<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function ShowSum() {
            var n1 = parseInt(prompt("Enter 1st number: "));
            var n2 = parseInt(prompt("Enter 2nd number: "));

            document.write(`Sum of two numbers ${n1} and ${n2} is ${n1+n2}`)
        }
    </script>
</head>
<body>
    <input type="button" value="Calc Sum" onclick="ShowSum()">
</body>
</html>
