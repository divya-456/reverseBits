<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function showPrompt() {
            var name = prompt("Enter your name!","John");
            if (name != null && name != ""){
                document.write(`Your name is ${name}`);
            } else if (name == null) {
                document.write("You pressed cancel!")
            } else {
                document.write("Value is blank!")
            }
        }
    </script>
</head>
<body>
    <button onclick="showPrompt()">Click here</button>
</body>
</html>
