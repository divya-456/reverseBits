<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height: 100px;
            width: 100px;
            background-color: red;
        }
        marquee {
            background-color: yellowgreen;
        }
    </style>
    <script>
        function bigDiv(e) {
            e.style.height = "200px";
            e.style.width = "200px";
        }
        function smallDiv(e) {
            e.style.height = "50px";
            e.style.width = "50px";

        }
    </script>
</head>
<body>
    <div onmouseover="bigDiv(this)" onmouseout="smallDiv(this)">

    </div>
    <marquee direction="right" onmouseover="this.stop()" onmouseout="this.start()"> This is the news</marquee>
</body>
</html>
