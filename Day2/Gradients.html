<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1 {
            margin: 10px;
            height: 100px;
            width: 500px;
            border: 1px solid black;
            background: linear-gradient(to top right, red, orange, yellow, green, blue,indigo, violet);
        }
        .div2 {
            margin: 10px;
            height: 100px;
            width: 500px;
            border: 1px solid black;
            background: linear-gradient(0deg,red, orange, rgba(255,255,0,0.6), green, blue,indigo, violet);
        }
        .div3 {
            margin: 10px;
            height: 100px;
            width: 500px;
            border: 1px solid black;
            background: repeating-linear-gradient(red,green 20%,blue 50%);
        }
        .div4 {
            margin: 10px;
            height: 500px;
            width: 500px;
            border: 1px solid black;
            background: radial-gradient(circle,red 33.3%,green 66.6%,black 100%)
        }
        .div5 {
            margin: 10px;
            height: 100px;
            width: 500px;
            border: 1px solid black;
            background: radial-gradient(closest-side at 30% 40%,red, green, blue);
        }
        .div6 {
            margin: 10px;
            height: 100px;
            width: 500px;
            border: 1px solid black;
            background: radial-gradient(farthest-side at 30% 40%,red, green, blue);
        }
        .div7 {
            margin: 10px;
            height: 100px;
            width: 500px;
            border: 1px solid black;
            background: radial-gradient(closest-corner at 30% 40%,red, green, blue);
        }
        .div8 {
            margin: 10px;
            height: 100px;
            width: 500px;
            border: 1px solid black;
            background: radial-gradient(farthest-corner at 30% 40%,red, green, blue);
        }
        .div9 {
            margin: 10px;
            height: 100px;
            width: 500px;
            border: 1px solid black;
            background: repeating-radial-gradient(red, green 10%, blue 15%);
        }
    </style>
</head>
<body>
    <div class="div1"></div>
    <div class="div2"></div>
    <div class="div3"></div>
    <div class="div4"></div>
    <div class="div5"></div>
    <div class="div6"></div>
    <div class="div7"></div>
    <div class="div8"></div>
    <div class="div9"></div>
</body>
</html>
