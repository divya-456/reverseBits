<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      p:first-child {
        background-color: blueviolet;
      }
      p:last-child {
        background-color: red;
      }
    </style>
  </head>
  <body>
    <div></div>
    <p>This is a p tag and <b>first</b> child of <b>body</b></p>
    <p>This is a p tag and <b>second</b> child of <b>body</b></p>
    <div>
      <p>This is a p tag and <b>first</b> child of <b>div</b></p>
      <p>This is a p tag and <b>second</b> child of <b>div</b></p>
    </div>
  </body>
</html>
