<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            position: absolute;
            height: 100px;
            width: 100px;
            background-color: green;
            animation: demo1 3s ease 1s infinite alternate;
        }

        @keyframes demo1 {
            from {
                left: 0px;
                transform: rotate(0deg) scale(1);
                background-color: green;
                border-radius: 0%;
            }
            to {
                transform: rotate(180deg) scale(1.5);
                left: 500px;
                background-color: red;
                border-radius: 50%;
            }
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
