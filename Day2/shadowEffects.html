<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .demo1 {
        text-shadow: 2px 3px red;
      }
      .demo2 {
        text-shadow: 2px 3px 4px red;
      }
      .demo3 {
        text-shadow: -2px -3px 4px red, -5px -5px 5px blue;
      }
      .demo4 {
        box-shadow: -2px -3px 4px red, 5px 5px 5px blue;
      }
    </style>
  </head>
  <body>
    <p class="demo1">This is a p tag</p>
    <p class="demo2">This is a p tag</p>
    <p class="demo3">This is a p tag</p>
    <p class="demo4">This is a p tag</p>
  </body>
</html>
