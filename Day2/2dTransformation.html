<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1,.div2 {
            height: 100px;
            width: 100px;
            background-color: yellowgreen;
            margin: 10px;
            padding: 10px;
        }
        .div2 {
            transform: skew(10deg,10deg);
        }
    </style>
</head>
<body>
    <div class="div1">
        This is a div
    </div>
    <div class="div2">
        This is a skewed div
    </div>
</body>
</html>
