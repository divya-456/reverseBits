<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #expand-toggle {
            display: none;
        }
        .expand {
            visibility: collapse;
        }
        .button {
            background-color: blue;
            color: white;
            border-radius: 16px;
            margin: 10px;
            padding: 2px 15px;
        }
        #expand-toggle:checked ~ * .expand {
            visibility: visible;
        }
    </style>
</head>
<body>
    <input type="checkbox" id="expand-toggle">
    <table>
        <tr class="expand">
            <td>[more content]</td>
            <td>[more content]</td>
            <td>[more content]</td>
        </tr>
        <tr>
            <td>Shown Content</td>
            <td>Shown Content</td>
            <td>Shown Content</td>
        </tr>
        <tr>
            <td>Shown Content</td>
            <td>Shown Content</td>
            <td>Shown Content</td>
        </tr>
        <tr class="expand">
            <td>[more content]</td>
            <td>[more content]</td>
            <td>[more content]</td>
        </tr>
    </table>
    <label for="expand-toggle" class="button">View hidden items</label>
</body>
</html>
